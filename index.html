<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whiscovery</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Pretendard", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(135deg, rgba(10, 10, 18, 0.78), rgba(42, 24, 10, 0.72)),
          url("assets/bgOpen.jpg") center/cover no-repeat;
        color: #fef3c7;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.16) 50%, transparent 100%);
        transform: translateX(-100%);
        animation: shimmer 2.4s ease-in-out infinite;
        pointer-events: none;
      }

      main {
        width: min(640px, 100%);
        text-align: center;
        padding: 40px 32px;
        border-radius: 28px;
        background: rgba(17, 24, 39, 0.72);
        border: 1px solid rgba(255,255,255,0.16);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(14px);
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 14px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(251, 191, 36, 0.18);
        color: #fde68a;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.7rem, 3vw, 2.6rem);
        line-height: 1.2;
      }

      p {
        margin: 0 0 24px;
        line-height: 1.7;
        font-size: 1rem;
        color: #fef3c7;
      }

      .quote {
        margin: 0 0 14px;
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        font-style: italic;
        color: #fef3c7;
        opacity: 0.95;
      }

      .subtext {
        margin: 0 0 18px;
        font-size: 0.95rem;
        color: rgba(254, 243, 199, 0.82);
      }

      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 10px 20px rgba(217, 119, 6, 0.25);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      a:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(217, 119, 6, 0.32);
      }

      .loading-bar {
        width: min(320px, 100%);
        height: 8px;
        margin: 20px auto 18px;
        border-radius: 999px;
        background: rgba(255,255,255,0.16);
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .loading-bar span {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #fef3c7, #f59e0b 45%, #fef3c7 100%);
        transition: width 0.12s linear;
      }

      .timer {
        margin: 6px 0 20px;
        font-size: 0.95rem;
        color: rgba(254, 243, 199, 0.9);
      }

      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      @keyframes loading {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(220%); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Whiscovery</div>
      <h1>위스키를 아는 것은 하나의 책을 읽는 것이고, 위스키를 마시는 것은 기분이 좋다.</h1>
      <p>당신의 위스키 여정을 노션에서 더 깊이 만나보세요.</p>
      <div class="quote">데이터를 불러오는 중입니다. 잠시만 기다려 주세요.</div>
      <div class="subtext" id="statusText">연결 상태를 확인하고 있어요. 조금만 더 기다려 주세요.</div>
      <div class="loading-bar" aria-label="로딩 진행률"><span id="loadingFill"></span></div>
      <div class="timer">자동 이동까지 <span id="countdown">15</span>초</div>
      <a href="https://speckled-people-03c.notion.site/WhiscoveryCS-e080da6ef9774da8b8f5a1fcdb260c2f?source=copy_link">바로 열기</a>
    </main>
    <script>
      const targetUrl = "https://speckled-people-03c.notion.site/WhiscoveryCS-e080da6ef9774da8b8f5a1fcdb260c2f?source=copy_link";
      const delayMs = 15000;
      const countdownEl = document.getElementById("countdown");
      const statusTextEl = document.getElementById("statusText");
      const loadingFillEl = document.getElementById("loadingFill");
      const startTime = Date.now();

      const updateLoader = () => {
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, Math.ceil((delayMs - elapsed) / 1000));
        const progress = Math.min(100, (elapsed / delayMs) * 100);

        if (countdownEl) countdownEl.textContent = remaining;
        if (loadingFillEl) loadingFillEl.style.width = `${progress}%`;
        if (statusTextEl && remaining <= 3) {
          statusTextEl.textContent = "곧 노션 페이지로 연결됩니다. 잠시만 기다려 주세요.";
        }

        if (elapsed < delayMs) {
          requestAnimationFrame(updateLoader);
        }
      };

      requestAnimationFrame(updateLoader);

      window.setTimeout(() => {
        window.location.replace(targetUrl);
      }, delayMs);
    </script>
  </body>
</html>
